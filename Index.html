<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>A Thousand Ways to Say I Love You</title>
<style>
:root{--serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;--sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;overflow:hidden;touch-action:manipulation}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#stage{position:fixed;inset:0;z-index:1;overflow:hidden}
#glow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,60,125,.30) 0%,rgba(255,60,125,.10) 38%,rgba(255,60,125,0) 66%);opacity:0;transition:opacity 3s ease;pointer-events:none}
#glow.on{opacity:1}
#words{position:absolute;inset:0;z-index:2;pointer-events:none}
.w{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--serif);font-weight:500;line-height:1;opacity:0;will-change:transform,opacity;unicode-bidi:plaintext;text-shadow:0 0 .4em rgba(255,110,160,.75)}
#words.beat{animation:beat 2.8s ease-in-out infinite}
#glow.beat{animation:beatg 2.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.04)}28%{transform:scale(1)}42%{transform:scale(1.025)}70%{transform:scale(1)}}
@keyframes beatg{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}14%{transform:translate(-50%,-50%) scale(1.1);opacity:1}28%{transform:translate(-50%,-50%) scale(1)}42%{transform:translate(-50%,-50%) scale(1.06);opacity:.95}70%{transform:translate(-50%,-50%) scale(1)}}
#name{position:absolute;z-index:3;transform:translate(-50%,-50%);display:flex;padding-left:.14em;font-family:var(--serif);font-weight:500;color:#fff;letter-spacing:.14em;line-height:1;white-space:nowrap;text-shadow:0 0 10px rgba(255,170,200,.95),0 0 28px rgba(255,70,135,.75),0 0 60px rgba(255,60,130,.45)}
#name .l{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(16px) scale(.85);transition:opacity 1.4s ease,filter 1.4s ease,transform 1.4s cubic-bezier(.2,.8,.2,1)}
#name.on .l{opacity:1;filter:blur(0);transform:none}
#final{position:absolute;z-index:3;left:50%;transform:translateX(-50%);width:min(88vw,440px);text-align:center}
#l1{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(16px,4.6vw,22px);line-height:1.5;color:#ffe3ec;text-shadow:0 0 14px rgba(255,120,165,.5)}
#l2{margin:14px 0 0;font-family:var(--sans);font-weight:300;font-size:clamp(12px,3.4vw,15px);letter-spacing:.16em;color:#ff9db8;text-shadow:0 0 12px rgba(255,90,140,.6)}
#l1,#l2{opacity:0;transform:translateY(8px);transition:opacity 2s ease,transform 2s ease}
#l1.show,#l2.show{opacity:1;transform:none}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.8rem;padding:0 8vw;text-align:center;cursor:pointer;transition:opacity 1s ease}
#intro.out{opacity:0;pointer-events:none}
#bgheart{position:absolute;width:min(78vw,520px);fill:#ff2d6f;opacity:.05;pointer-events:none;animation:hb 3.4s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(.92);opacity:.04}50%{transform:scale(1.04);opacity:.13}}
#t1{position:relative;margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(28px,8vw,46px);line-height:1.25;color:#fff;text-shadow:0 0 16px rgba(255,150,190,.8),0 0 44px rgba(255,60,130,.5);opacity:0;animation:rise 2.4s ease 1s forwards}
#go{position:relative;font-family:var(--sans);font-weight:300;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#ffd6e3;background:transparent;border:1px solid rgba(255,150,190,.5);border-radius:999px;padding:1em 2.1em;cursor:pointer;opacity:0;animation:rise 2s ease 3.2s forwards,gl 3s ease-in-out 5.2s infinite}
#go:focus-visible{outline:2px solid #ff9db8;outline-offset:4px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes gl{0%,100%{box-shadow:0 0 8px rgba(255,90,150,.25),inset 0 0 8px rgba(255,90,150,.1)}50%{box-shadow:0 0 24px rgba(255,90,150,.6),inset 0 0 14px rgba(255,90,150,.25)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage">
  <div id="glow"></div>
  <div id="words"></div>
  <div id="name" aria-label="Simar"></div>
  <div id="final"><p id="l1">Every language has different words, but my heart has only one meaning.</p><p id="l2">Simar, I love you. ♡</p></div>
</div>
<div id="intro">
  <svg id="bgheart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  <p id="t1">I have something to tell you…</p>
  <button id="go" type="button">Tap to discover ♡</button>
</div>
<script>
(function(){
var L=["I Love You","Je t’aime","Te amo","Ich liebe dich","Ti amo","愛してる","사랑해","我爱你","Я тебя люблю","मैं तुमसे प्यार करता हूँ","मैं तुझसे प्यार करता हूँ","أحبك","Eu te amo","Ik hou van jou","Kocham cię","Seni seviyorum","Nakupenda","Σ’ αγαπώ","Mahal kita","আমি তোমাকে ভালোবাসি"];
var COL=["#fff4f7","#ffc2d1","#ff8fb1","#ffd9e3","#ff9db8"];
var AC=["255,200,215","255,140,175","255,255,255"];
var FONT='"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif';
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var $=function(i){return document.getElementById(i)};
var cv=$("fx"),g=cv.getContext("2d"),mc=document.createElement("canvas").getContext("2d");
var W,H,S,ox,oy,bx,by,bhw,bhh,F,sF,words=[],amb=[],spk=[],spAcc=0;
var started=false,running=false,formed=false,sparkOn=false,t0=0,TF=0,dim=1,dimT=1;

function inside(px,py){var x=(px-ox)/S,y=(oy-py)/S,a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0}
function ins(px,py,k){var cx=ox,cy=oy-.125*S;return inside(cx+(px-cx)/k,cy+(py-cy)/k)}

function size(){
  W=innerWidth;H=innerHeight;var d=Math.min(devicePixelRatio||1,2);
  cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);
  S=Math.min(W*.41,(H-130-70)/2.25,260);
  var tm=Math.max(24,(H-(2.25*S+24+130))*.45);
  ox=W/2;oy=tm+1.25*S;bx=ox;by=oy-.13*S;bhw=.58*S;bhh=.16*S;
  var nm=$("name");nm.style.left=ox+"px";nm.style.top=by+"px";nm.style.fontSize=Math.max(28,S*.24)+"px";
  $("final").style.top=(oy+S+26)+"px";
  var gl=$("glow");gl.style.left=ox+"px";gl.style.top=(oy-.125*S)+"px";gl.style.width=gl.style.height=(2.8*S)+"px";
  $("words").style.transformOrigin=ox+"px "+(oy-.125*S)+"px";
  amb=[];var n=Math.round(Math.min(70,W*H/9000));
  for(var i=0;i<n;i++)amb.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,v:4+Math.random()*10,a:.25+Math.random()*.5,tw:.6+Math.random()*1.6,ph:Math.random()*6.28,c:AC[i%3]});
}

function layout(f){
  mc.font=f+"px "+FONT;
  var wd=L.map(function(s){return mc.measureText(s).width});
  var lh=f*1.8,hh=f*.95,gap=f*.9,pad=f*.5,out=[],c=0;
  for(var y=oy-1.25*S+lh*.6;y<oy+.98*S;y+=lh){
    var segs=[],a=-1,x;
    for(x=0;x<=W;x+=2){
      var ok=inside(x,y-hh)&&inside(x,y+hh)&&!(Math.abs(x-bx)<bhw&&Math.abs(y-by)<bhh+hh);
      if(ok){if(a<0)a=x}else if(a>=0){segs.push([a,x-2]);a=-1}
    }
    if(a>=0)segs.push([a,W]);
    segs.forEach(function(sg){
      var w0=sg[1]-sg[0]-2*pad,row=[],tot=0;
      while(true){var k=c%20,add=wd[k]+(row.length?gap:0);if(tot+add>w0)break;row.push({k:k,c:c});tot+=add;c++}
      var n=row.length;if(!n)return;
      var gp=gap;if(n>1)gp=Math.min(gap+(w0-tot)/(n-1),gap*2.4);
      var total=tot-(n-1)*gap+(n-1)*gp,xs=(sg[0]+sg[1])/2-total/2;
      row.forEach(function(r){out.push({x:xs+wd[r.k]/2,y:y,k:r.k,c:r.c});xs+=wd[r.k]+gp});
    });
  }
  return out;
}

function build(){
  var box=$("words");box.innerHTML="";words=[];
  var f=17,sl;
  for(;f>=8;f-=.5){sl=layout(f);if(sl.length>=30)break}
  if(f<8){f=8;sl=layout(8)}
  F=f*2.2;sF=1/2.2;
  sl.sort(function(a,b){return a.c-b.c});
  var tf=0,r=RM;
  sl.forEach(function(s,i){
    var el=document.createElement("span");el.className="w";el.textContent=L[s.k];
    el.style.fontSize=F+"px";el.style.color=COL[s.k%5];box.appendChild(el);
    var ts=s.c<20?s.c*(r?.05:.36):(r?1:20*.36)+(s.c-20)*(r?.02:.14);
    var w={el:el,x:s.x,y:s.y,ts:ts,tt:ts+(r?.4:1.6),dur:r?.01:2.4,
      sx:W/2+(Math.random()-.5)*W*.5,sy:oy-.12*S+(Math.random()-.5)*S*1.7,
      s0:sF*(1.8+Math.random()*1.6),ph:Math.random()*6.28,dir:i%2?1:-1,al:s.c<20?1:.62,fin:false,b:null};
    tf=Math.max(tf,w.tt+w.dur);words.push(w);
  });
  TF=tf;
}

function pos(w,t){return RM?[w.sx,w.sy]:[w.sx+Math.sin(t*.8+w.ph)*7,w.sy+Math.cos(t*.6+w.ph)*9-(t-w.ts)*5]}
function ease(e){return e<.5?4*e*e*e:1-Math.pow(-2*e+2,3)/2}

function upd(t){
  for(var i=0;i<words.length;i++){
    var w=words[i];if(w.fin)continue;
    var l=t-w.ts;if(l<0)continue;
    var s=w.el.style;
    if(t<w.tt){
      var a=Math.min(1,l/(RM?.4:1.3)),p=pos(w,t);
      s.opacity=a;s.transform="translate3d("+p[0]+"px,"+p[1]+"px,0) translate(-50%,-50%) scale("+(w.s0*(.9+.1*a))+")";
    }else{
      if(!w.b)w.b=pos(w,w.tt);
      var e=Math.min(1,(t-w.tt)/w.dur),q=ease(e),b=w.b;
      var dx=w.x-b[0],dy=w.y-b[1],len=Math.sqrt(dx*dx+dy*dy)||1,c=Math.sin(Math.PI*q)*len*.16*w.dir;
      var x=b[0]+dx*q-dy/len*c,y=b[1]+dy*q+dx/len*c,sc=w.s0+(sF-w.s0)*q;
      s.opacity=1+(w.al-1)*q;
      s.transform="translate3d("+x+"px,"+y+"px,0) translate(-50%,-50%) scale("+sc+")";
      if(e>=1)w.fin=true;
    }
  }
}

function fx(dt,t){
  g.clearRect(0,0,W,H);
  dim+=(dimT-dim)*Math.min(1,dt*1.1);
  for(var i=0;i<amb.length;i++){
    var p=amb[i];p.y-=p.v*dt;p.x+=Math.sin(t*.5+p.ph)*.12;
    if(p.y<-4){p.y=H+4;p.x=Math.random()*W}
    var al=p.a*(.55+.45*Math.sin(t*p.tw+p.ph))*dim;
    g.fillStyle="rgba("+p.c+","+al+")";g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill();
  }
  if(sparkOn){
    spAcc+=dt*16;
    while(spAcc>1){
      spAcc--;if(spk.length>=55)break;
      for(var n=0;n<30;n++){
        var px=ox+(Math.random()*2.7-1.35)*S,py=oy+(Math.random()*2.7-1.3)*S;
        if(ins(px,py,1.14)&&!ins(px,py,.93)){spk.push({x:px,y:py,r:.7+Math.random()*1.5,l:0,m:1.6+Math.random()*1.8});break}
      }
    }
    g.strokeStyle="rgba(255,225,235,.8)";g.lineWidth=.6;
    for(var j=spk.length-1;j>=0;j--){
      var q=spk[j];q.l+=dt;if(q.l>=q.m){spk.splice(j,1);continue}
      var a2=Math.sin(Math.PI*q.l/q.m);
      g.globalAlpha=a2;g.fillStyle="#ffdce8";g.beginPath();g.arc(q.x,q.y,q.r,0,6.283);g.fill();
      var ln=q.r*4*a2;g.beginPath();g.moveTo(q.x-ln,q.y);g.lineTo(q.x+ln,q.y);g.moveTo(q.x,q.y-ln);g.lineTo(q.x,q.y+ln);g.stroke();
    }
    g.globalAlpha=1;
  }
}

function finale(){
  dimT=.22;$("glow").classList.add("on");
  if(!RM){$("words").classList.add("beat");$("glow").classList.add("beat")}
  var d=RM?200:1600;
  setTimeout(function(){$("name").classList.add("on")},d);
  setTimeout(function(){$("l1").classList.add("show")},d+(RM?200:2700));
  setTimeout(function(){$("l2").classList.add("show")},d+(RM?400:4900));
}

var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(running){
    var t=(now-t0)/1000;upd(t);
    if(!sparkOn&&t>TF-2.5)sparkOn=true;
    if(!formed&&t>TF+(RM?.3:1.3)){formed=true;finale()}
  }
  if(!RM)fx(dt,now/1000);
  requestAnimationFrame(frame);
}

function start(){
  if(started)return;started=true;
  $("intro").classList.add("out");
  setTimeout(function(){$("intro").style.display="none"},1100);
  setTimeout(function(){build();t0=performance.now();running=true},RM?200:1000);
}

var nm=$("name");"SIMAR".split("").forEach(function(c,i){var s=document.createElement("span");s.className="l";s.textContent=c;s.style.transitionDelay=(i*.3)+"s";nm.appendChild(s)});
size();
$("intro").addEventListener("click",start);
var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){size();if(running){build()}},150)});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
